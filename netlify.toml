# Caldera — caldera.beer
# Static site. No build step: `public/` is published as-is.

[build]
  publish = "public"
  command = ""

# Stylesheets and scripts keep stable filenames and are replaced in place,
# so they must revalidate. A content hash on the query string busts the cache
# on change; the ETag makes the revalidation a cheap 304 the rest of the time.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Media is also replaced in place occasionally (a re-shot bottle, a re-encoded
# video), so no "immutable" here either — a day, then revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
