# Caldera — caldera.beer
# Static site. No build step: `public/` is published as-is.

[build]
  publish = "public"
  command = ""

# Media caches for a day, then revalidates. Not "immutable": images and video
# do get replaced in place here (a re-shot bottle, a re-encoded clip).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Stylesheets and scripts keep stable filenames, so they must always revalidate.
# These come after the catch-all above: later matching rules win in Netlify.
# References also carry ?v=<content hash>, which busts the cache on change.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
